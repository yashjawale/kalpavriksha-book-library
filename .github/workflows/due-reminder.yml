name: Send Due Date Reminders

on:
  schedule:
    # 4:00 AM UTC = 9:30 AM IST — runs daily on the default branch
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Check date (YYYY-MM-DD). Defaults to tomorrow.'
        required: false
        type: string
      dry-run:
        description: 'Preview which emails would be sent without sending any'
        required: false
        type: boolean
        default: false

# Needed for the keepalive step to push an empty commit and prevent
# GitHub from auto-disabling scheduled workflows after 60 days of inactivity.
permissions:
  contents: write

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Send due date reminders
        run: npx tsx scripts/send-due-reminders.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REMINDER_DATE: ${{ inputs.date || '' }}
          REMINDER_DRY_RUN: ${{ inputs.dry-run || '' }}

      - name: Keep workflow alive
        # GitHub auto-disables scheduled workflows after 60 days without
        # repository activity. An empty commit counts as activity and resets
        # the 60-day timer. Run only on Mondays to stay well within the
        # window while avoiding daily noise.
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Skipping keepalive — not Monday."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
