name: Keepalive

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday 00:00 UTC — prevents scheduled workflows from being disabled after 60 days of inactivity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive commit
        run: |
          # GitHub auto-disables scheduled workflows after 60 days without
          # repository activity. An empty commit counts as activity and resets
          # the 60-day timer. Weekly check with 50-day threshold stays well
          # within the window while avoiding noise when active.
          LAST_COMMIT=$(git log -1 --format=%ct)
          THRESHOLD=$(date -d '50 days ago' +%s)
          if [ "$LAST_COMMIT" -lt "$THRESHOLD" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
          else
            echo "Repository is active, no keepalive commit needed"
          fi
